<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="color-scheme" content="dark">
<title>Siren Pad</title>
<style>
:root{--bg:#0b1020;--card:#151c33;--card2:#1d2646;--txt:#e8ecff;--mut:#8a94c0;--acc:#ff4d5e;--blue:#3d8bff;--amb:#ffb020;--grn:#2fd18b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html{color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
h1{font-size:20px;margin:0;letter-spacing:.08em}
#status{font-size:13px;color:var(--mut)}
.lights{height:10px;border-radius:6px;background:var(--card);overflow:hidden;position:relative}
.lights i{position:absolute;top:0;bottom:0;width:50%;opacity:0}
.lights i:first-child{left:0;background:var(--acc)}
.lights i:last-child{right:0;background:var(--blue)}
body.on .lights i:first-child{animation:fl .5s steps(1) infinite}
body.on .lights i:last-child{animation:fl .5s steps(1) infinite .25s}
@keyframes fl{0%{opacity:1}50%{opacity:0}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0}
button{font:inherit;color:var(--txt);border:0;border-radius:18px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:20px;letter-spacing:.06em;touch-action:manipulation;transition:transform .08s,background .15s,box-shadow .15s}
button small{font-weight:500;font-size:12px;color:var(--mut);letter-spacing:0}
button:active{transform:scale(.97)}
button.active{background:var(--c);box-shadow:0 0 28px var(--c);color:#fff}
button.active small{color:#ffffffcc}
#wail{--c:var(--acc)}#yelp{--c:var(--amb)}#phaser{--c:var(--blue)}#tone{--c:var(--grn)}#horn{--c:#c05cff}#wolf{--c:#ff7a3d}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:96px}
.vol{background:var(--card);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.vol input{flex:1;accent-color:var(--acc);height:32px}
.stop{height:56px;background:#2a1118;color:#ff8a96;font-size:16px;flex-direction:row}
.stop.active{background:var(--acc)}
</style>
</head>
<body>
<header><h1>SIREN PAD</h1><span id="status">нажми, чтобы включить звук</span></header>
<div class="lights"><i></i><i></i></div>
<div class="grid">
  <button id="wail">WAIL<small>протяжная</small></button>
  <button id="yelp">YELP<small>частая</small></button>
  <button id="phaser">PHASER<small>быстрая</small></button>
  <button id="tone">TONE<small>ровный тон</small></button>
</div>
<div class="row">
  <button id="horn">HORN<small>держи — гудок</small></button>
  <button id="wolf">WOLF<small>разовый сигнал</small></button>
</div>
<div class="vol"><span>🔈</span><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"><span>🔊</span></div>
<button class="stop" id="stop">■ ВЫКЛЮЧИТЬ ВСЁ</button>

function b2ab(b){const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
const SIRENS=['wail','yelp','phaser','tone'];
let ctx,master,meta={},buf={},cur=null,hornSrc=null,ready=null;
const $=id=>document.getElementById(id);
const status=$('status');

async function init(){
  if(ready) return ready;
  ready=(async()=>{
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=+$('vol').value; master.connect(ctx.destination);
    meta=META;
    await Promise.all(Object.keys(B64).map(async k=>{
      buf[k]=await ctx.decodeAudioData(b2ab(B64[k]));
    }));
    status.textContent='готово';
  })();
  try{await ready}catch(e){status.textContent='ошибка загрузки звуков';ready=null;throw e}
  return ready;
}
function loop(name){
  const s=ctx.createBufferSource(); s.buffer=buf[name]; s.loop=true;
  const m=meta[name]||{}; s.loopStart=m.loopStart||0; s.loopEnd=m.dur?Math.min(m.dur,buf[name].duration):buf[name].duration;
  const g=ctx.createGain(); g.gain.value=0; g.gain.linearRampToValueAtTime(1,ctx.currentTime+.04);
  s.connect(g); g.connect(master); s.start(0,s.loopStart); return {s,g};
}
function stopNode(n){ if(!n)return; const t=ctx.currentTime; n.g.gain.cancelScheduledValues(t); n.g.gain.setValueAtTime(n.g.gain.value,t); n.g.gain.linearRampToValueAtTime(0,t+.06); n.s.stop(t+.08); }
function refresh(){
  SIRENS.forEach(k=>$(k).classList.toggle('active',cur&&cur.name===k));
  $('horn').classList.toggle('active',!!hornSrc);
  document.body.classList.toggle('on',!!cur||!!hornSrc);
  status.textContent=cur?cur.name.toUpperCase():(hornSrc?'HORN':'выключено');
}
async function toggle(name){
  await init(); if(ctx.state==='suspended') await ctx.resume();
  const was=cur&&cur.name;
  if(cur){stopNode(cur.node);cur=null}
  if(was!==name) cur={name,node:loop(name)};
  refresh(); keepAwake();
}
SIRENS.forEach(k=>$(k).addEventListener('click',()=>toggle(k)));

const horn=$('horn');
async function hornOn(e){e.preventDefault(); await init(); if(ctx.state==='suspended') await ctx.resume(); if(hornSrc)return; hornSrc=loop('horn'); refresh();}
function hornOff(){ if(!hornSrc)return; stopNode(hornSrc); hornSrc=null; refresh(); }
horn.addEventListener('pointerdown',hornOn);
['pointerup','pointercancel','pointerleave'].forEach(ev=>horn.addEventListener(ev,hornOff));
horn.addEventListener('contextmenu',e=>e.preventDefault());

$('wolf').addEventListener('click',async()=>{
  await init(); if(ctx.state==='suspended') await ctx.resume();
  const s=ctx.createBufferSource(); s.buffer=buf.wolf; s.connect(master); s.start();
  $('wolf').classList.add('active'); s.onended=()=>$('wolf').classList.remove('active');
});
$('stop').addEventListener('click',()=>{ if(!ctx)return; if(cur){stopNode(cur.node);cur=null} hornOff(); refresh(); });
$('vol').addEventListener('input',e=>{ if(master) master.gain.value=+e.target.value; });

let lock=null;
async function keepAwake(){ try{ if('wakeLock' in navigator && !lock){ lock=await navigator.wakeLock.request('screen'); lock.addEventListener('release',()=>lock=null);} }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&(cur||hornSrc)) keepAwake(); });
</script>
